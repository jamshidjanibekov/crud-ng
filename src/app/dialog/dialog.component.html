<h1 mat-dialog-title>Add product</h1>
<div mat-dialog-content>
  <form [formGroup]="productForm" >
    <mat-form-field >
      <mat-label>Name of product</mat-label>
      <input matInput placeholder="Phone" formControlName="productName">
      <mat-icon matSuffix>dialpad</mat-icon>
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Category</mat-label>
      <mat-select formControlName="category">
        @for (food of foods; track food) {
          <mat-option [value]="food.value">{{food.viewValue}}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field class="example-full-width">
      <mat-label>Choose a date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date">
      <mat-datepicker-toggle matIconSuffix [for]="picker">
        <mat-icon matDatepickerToggleIcon>keyboard_arrow_down</mat-icon>
      </mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-radio-group
      formControlName="condition"
      class="example-radio-group"
      [(ngModel)]="favoriteSeason">
      @for (season of seasons; track season) {
        <mat-radio-button class="example-radio-button" type="radio" [value]="season">{{season}}</mat-radio-button>
      }
    </mat-radio-group>

    <mat-form-field >
      <mat-label>Price</mat-label>
      <input matInput type="number" placeholder="$" formControlName="price">
      <mat-icon matSuffix> attach_money</mat-icon>
    </mat-form-field>

    <mat-form-field >
      <mat-label>Commit</mat-label>
      <textarea matInput formControlName="comment"></textarea>
    </mat-form-field>
  </form>
</div>
<div mat-dialog-actions [align]="'end'" >
  <button mat-raised-button color="warn" mat-dialog-close>Close</button>
  <button mat-raised-button color="primary" (click)="addProduct()" >Save</button>
</div>
